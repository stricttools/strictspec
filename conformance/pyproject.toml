[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strictspec-conformance"
version = "0.0.0"
description = "Cross-target conformance suite for strictspec (dev_node)"
requires-python = ">=3.11"
dependencies = []
keywords = ["rlsbl"]

[project.scripts]
strictspec-conformance = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["harness"]
