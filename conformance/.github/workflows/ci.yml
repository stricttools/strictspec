name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - name: Sync conformance project
        run: uv sync --locked
      # All four targets are declared stubs (implemented=false), so every case
      # reports UNIMPLEMENTED and the harness exits green as long as no fixture is
      # malformed. When a target implementation lands, mismatches will fail here.
      - name: Run conformance harness
        run: uv run strictspec-conformance
      - name: Run harness tests
        run: uv run pytest -q
