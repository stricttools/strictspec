code = "STRICTSPEC_INTRA_PAIRWISE_DISTINCT"
path = "$.group[1].tag"
slots = { value = '"x"', normalization = "none" }

[[expected.diagnostics]]
code = "STRICTSPEC_INTRA_UNIQUE_BY"
path = "$.group[1].item"
slots = { value = '"x"', field = "id", normalization = "none" }
