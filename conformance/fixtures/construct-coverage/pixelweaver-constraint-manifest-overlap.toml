name = "pixelweaver-constraint-manifest-overlap"
category = "construct-coverage"
provenance = "derived-from(examples/pixelweaver/samples/constraint-manifest.invalid-overlap.json, verified against spec)"
description = """
Three constraint-pass violations, emitted in check-declaration order (all attach at the root record):
pairwise-distinct on the palette (case-fold), unique-by id on classes (none normalization), and
ranges-disjoint on the [start, start+len) half-open class ranges. Verified against the pinned
templates and appendix-rendering value forms (strings double-quoted; half-open ranges as `[a, b)`)."""
schema = "_schemas/pixelweaver-constraint-manifest.toml"
input = "_inputs/pixelweaver/constraint-manifest.invalid-overlap.json"

[expected]
valid = false

[[expected.diagnostics]]
code = "STRICTSPEC_INTRA_PAIRWISE_DISTINCT"
path = "$.palette"
slots = { value = '"#ff0000"', normalization = "case-fold" }

[[expected.diagnostics]]
code = "STRICTSPEC_INTRA_UNIQUE_BY"
path = "$.classes"
slots = { value = '"skin"', field = "id", normalization = "none" }

[[expected.diagnostics]]
code = "STRICTSPEC_INTRA_RANGES_DISJOINT"
path = "$.classes"
slots = { value = "[1, 3)", actual = "[0, 2)" }
