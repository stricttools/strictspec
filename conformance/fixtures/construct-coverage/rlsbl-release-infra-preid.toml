name = "rlsbl-release-infra-preid"
category = "construct-coverage"
provenance = "derived-from(examples/rlsbl-release-file/invalid-01-infra-preid.toml, re-verified against spec)"
description = """
An infra release that also sets `preid` -- forbidden-when fires:
STRICTSPEC_INTRA_FORBIDDEN_WHEN. The document ALSO double-lists "pypi" in include and exclude; the
schema now declares the Phase-3.3 `collections-disjoint` form (element-level set disjointness), so
that overlap IS caught (STRICTSPEC_INTRA_COLLECTIONS_DISJOINT) -- superseding the draft's FINDING 1,
which described the OLD field-level mutual-exclusion form that missed element overlaps. The two
phase-2 diagnostics fire in constraint-declaration order: forbidden-when (#2) before
collections-disjoint (#4).

Path convention: the forbidden-when diagnostic attaches at the offending field `$.preid`;
collections-disjoint attaches at the root record `$` (it ranges over the sibling include/exclude
arrays)."""
schema = "_schemas/rlsbl-release-file.toml"
input = "_inputs/rlsbl-release/invalid-01-infra-preid.toml"

[expected]
valid = false

[[expected.diagnostics]]
code = "STRICTSPEC_INTRA_FORBIDDEN_WHEN"
path = "$.preid"
slots = { key = "preid", condition = 'bump == "infra"' }

[[expected.diagnostics]]
code = "STRICTSPEC_INTRA_COLLECTIONS_DISJOINT"
path = "$"
slots = { fields = '["include", "exclude"]', value = '"pypi"', normalization = "none" }
