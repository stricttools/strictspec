# strictspec schema — predraw Scene (paper draft)
#
# Pinned surface (spec/appendix-surface-syntax.md): bare header + `role`/`root`; kind-typed
# `[types.<Name>]`; tuple `elements = ["number", "number"]`; typed map `.value`; array `.item`;
# discriminated-union / node-kind-union arms are subtables `[types.<U>.arms.<arm>]` (each a type
# site referencing the arm record, keyed by the discriminator literal or a node-kind arm name).
# Translated from predraw/predraw/schema/scene.schema.json (JSON docs).
# NOTE: predraw has NO format_version today; the value 1 below is a NET-NEW gate
# added by adoption (see gap-note.md #2).

name = "PredrawScene"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "PredrawScene"
description = "A predraw scene file defining a vector graphic composition."

[types.PredrawScene]
type = "record"

[types.PredrawScene.fields.width]
type = "number"
required = true
description = "Canvas width in pixels."
[types.PredrawScene.fields.height]
type = "number"
required = true
description = "Canvas height in pixels."
[types.PredrawScene.fields.background]
type = "string"
required = false
description = "Default background color (CSS color or $ref)."
[types.PredrawScene.fields.styles]
type = "map"
required = false
description = "Named style tokens; referenced via $name in fill values."
[types.PredrawScene.fields.styles.value]
type = "Style"
[types.PredrawScene.fields.imports]
type = "map"
required = false
description = "Alias name -> relative file path for external component defs."
[types.PredrawScene.fields.imports.value]
type = "string"
[types.PredrawScene.fields.defs]
type = "map"
required = false
description = "Inline component definitions (packed). Recursive: values are Elements."
[types.PredrawScene.fields.defs.value]
type = "Element"
[types.PredrawScene.fields.elements]
type = "array"
required = true
description = "Ordered list of elements to render."
[types.PredrawScene.fields.elements.item]
type = "Element"
[types.PredrawScene.fields.pipeline]
type = "array"
required = false
description = "Post-processing steps applied after initial layout."
[types.PredrawScene.fields.pipeline.item]
type = "PipelineStep"

# --- leaf sub-types ---

[types.Style]
type = "record"
description = "A style token with light and dark color values."
[types.Style.fields.light]
type = "string"
required = true
[types.Style.fields.dark]
type = "string"
required = true

[types.Transform]
type = "record"
description = "2D transform. (Source `default` values dropped — decision 30; absence handled consumer-side.)"
[types.Transform.fields.translate]
type = "tuple"
required = false
elements = ["number", "number"]
description = "Translation as [x, y]."
[types.Transform.fields.scale]
type = "tuple"
required = false
elements = ["number", "number"]
description = "Scale as [sx, sy]."

[types.Font]
type = "record"
description = "Font specification for text elements."
[types.Font.fields.family]
type = "string"
required = true
[types.Font.fields.size]
type = "number"
required = true
[types.Font.fields.weight]
type = "integer"
required = false
min = 100
max = 900
description = "Font weight (100-900). Source default 400 dropped."

[types.CharStyle]
type = "record"
description = "Per-character styling override for text elements."
[types.CharStyle.fields.chars]
type = "string"
required = true
[types.CharStyle.fields.opacity]
type = "number"
required = false
min = 0
max = 1
[types.CharStyle.fields.fill]
type = "string"
required = false

[types.GradientStop]
type = "record"
description = "A single stop in a gradient."
[types.GradientStop.fields.offset]
type = "number"
required = true
min = 0
max = 1
[types.GradientStop.fields.color]
type = "string"
required = true
[types.GradientStop.fields.opacity]
type = "number"
required = false
min = 0
max = 1

[types.Gradient]
type = "record"
description = "A gradient fill/stroke definition."
[types.Gradient.fields.type]
type = "enum"
required = true
values = ["linear-gradient", "radial-gradient"]
[types.Gradient.fields.stops]
type = "array"
required = true
[types.Gradient.fields.stops.item]
type = "GradientStop"
[types.Gradient.fields.angle]
type = "number"
required = false
[types.Gradient.fields.cx]
type = "number"
required = false
[types.Gradient.fields.cy]
type = "number"
required = false
[types.Gradient.fields.r]
type = "number"
required = false

# THE node-kind union that motivates the construct (decision 15): a color STRING
# (scalar arm) or a Gradient OBJECT (record arm) — distinct node kinds, no discriminator.
# Arms are subtables keyed by an arm name; the input node kind selects the arm.
[types.FillOrGradient]
type = "node-kind-union"
description = "A color string or a gradient object."
[types.FillOrGradient.arms.color]
type = "string"
[types.FillOrGradient.arms.gradient]
type = "Gradient"

# --- element discriminated union (by `type`) ---

[types.Element]
type = "discriminated-union"
discriminator = "type"
description = "A drawable element; the `type` field selects the arm. NOTE: source useElement makes `type` OPTIONAL (inferred from `use`); this draft makes it REQUIRED (a narrowing) — see gap-note.md #4."
[types.Element.arms.background]
type = "backgroundElement"
[types.Element.arms.rect]
type = "rectElement"
[types.Element.arms.path]
type = "pathElement"
[types.Element.arms.text]
type = "textElement"
[types.Element.arms.group]
type = "groupElement"
[types.Element.arms.use]
type = "useElement"

