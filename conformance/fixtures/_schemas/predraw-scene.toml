# --- pipeline discriminated union (by `action`) ---

[types.PipelineStep]
type = "discriminated-union"
discriminator = "action"
[types.PipelineStep.arms.center]
type = "centerStep"
[types.PipelineStep.arms.place]
type = "placeStep"
[types.PipelineStep.arms.group]
type = "groupStep"
[types.PipelineStep.arms."text-to-paths"]
type = "textToPathsStep"

[types.centerStep]
type = "record"
[types.centerStep.fields.action]
type = "literal"
required = true
value = "center"
[types.centerStep.fields.target]
type = "string"
required = true
[types.centerStep.fields.axis]
type = "enum"
required = false
values = ["x", "y", "both"]

[types.placeStep]
type = "record"
description = "Places an element relative to another. anyOf(below/above/left/right) -> at-least-one-of."
[types.placeStep.fields.action]
type = "literal"
required = true
value = "place"
[types.placeStep.fields.target]
type = "string"
required = true
[types.placeStep.fields.below]
type = "string"
required = false
[types.placeStep.fields.above]
type = "string"
required = false
[types.placeStep.fields.left]
type = "string"
required = false
[types.placeStep.fields.right]
type = "string"
required = false
[types.placeStep.fields.gap]
type = "number"
required = false
[[types.placeStep.constraints]]
form = "at-least-one-of"
fields = ["below", "above", "left", "right"]

[types.groupStep]
type = "record"
[types.groupStep.fields.action]
type = "literal"
required = true
value = "group"
[types.groupStep.fields.targets]
type = "array"
required = true
[types.groupStep.fields.targets.item]
type = "string"
[types.groupStep.fields.id]
type = "string"
required = true

[types.textToPathsStep]
