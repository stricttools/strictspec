# The next release of strictspec. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "minor"
# What this release is, in a sentence or two. Required.
description = "The Go module gains the confidential package, which reads the age-encrypted confidential-term list and a repository's resolutions of its hits; the machine-local confidential-name index is removed, and the lifecycle-and-license record holds license and lifecycle facts only."
# Why these changes were made. Optional.
context = "Confidential terms now live in one encrypted list outside every repository, and a release scans what it pushes or publishes against it, judging each hit. Only the Go module is released: the Python and TypeScript implementations are paused while the tools are rewritten in Go, and carry only the regenerated built-in schema."
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = ["pypi", "npm"]
release_commit = "a6c542d8871299636c058c08d19dc1b07b98ffc0"
