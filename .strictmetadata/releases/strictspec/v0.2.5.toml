# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "patch"
include = ["pypi", "go", "npm"]
exclude = []
description = "Release archives are built again"
context = "The 0.2.4 publish job failed under goreleaser-action 2.18.1, which reads the\nbare semver tag's contents and errored with `couldn't get tag contents: unexpected\ngit tag output for \"v0.2.4\"`, so that release carried no binary archives and the\nPyPI and npm launchers had nothing to download. The publish workflow now creates\nthe bare `v<version>` tag locally before invoking goreleaser."
release_commit = "cafe156ae615da5a3b58c337de8167ad47afa61e"
