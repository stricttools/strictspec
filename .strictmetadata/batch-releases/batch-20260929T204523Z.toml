format_version = 2
[releasables.strictspec]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Options built-in schemas and catalogued OPTIONS errors in every runtime, options that require other options, a Python TOML reader fix, and the CLI on strictcli 0.37.0."
# Optional context explaining why these changes were made
context = "The Go, Python, and TypeScript runtimes gain the options appendix: the options-entries, options-registry, and upstream built-in schemas with readers that validate and bind them, and the options ranking parser, registry validator, and per-namespace entry validator, whose refusals are catalogued STRICTSPEC_OPTIONS_* error codes in a new OPTIONS area. An option may now name the options it depends on in a required requires list, which moves the options-registry schema to format_version 2. The Python runtime reads TOML whose tables interleave with arrays of tables, as Go and TypeScript already did. The Go CLI follows strictcli's module move to github.com/stricttools/strictcli/go and requires v0.37.0, so it inherits that release's help and version commands, help --json in place of --dump-schema, prefixed errors, and refusal of a repeated non-repeatable flag; that part is breaking for scripts, which in 0.x is a minor."
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["pypi", "go", "npm"]
exclude = []
