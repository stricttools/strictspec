# strictspec paper schema — rlsbl JSONL changelog entry, CHANGESET-FILE mode.
# Source of truth: rlsbl/rlsbl/changelog/schema.py, validate_schema with
# coverage_unit="changeset-file". Sibling of the commit-mode schema; the
# consumer selects which schema to validate against from .rlsbl/config.json's
# coverage_unit (explicit mode selection — see gap-note.md). Pinned surface.
#
# The ONLY structural differences from commit mode: commits is FORBIDDEN, id is
# REQUIRED. Everything else (user_facing, description/type conditional-required,
# release_type, packages, per-line format_version) is identical.

name = "rlsbl-changelog-entry-changeset-file"
meta_version = 1
format_version = 1
document_syntax = "jsonl"
role = "schema"
root = "ChangelogEntry"
targets = ["python"]
description = "One JSONL changelog line in changeset-file mode: commits forbidden, id required."

[types.ChangelogEntry]
type = "record"

[types.ChangelogEntry.fields.format_version]
type = "integer"
required = true
description = "Per-line format_version (JSONL per-line gate)."

# commits is FORBIDDEN in changeset-file mode. There is no positive construct for "this field
# must be absent, always": a forbidden field is simply one the closed record does NOT declare, so
# its presence is an unknown-key error. (validate_schema: "commits must be empty in
# changeset-file mode".) NOT declared here on purpose — see gap note on "forbidden-always".

[types.ChangelogEntry.fields.user_facing]
type = "boolean"
required = true

[types.ChangelogEntry.fields.description]
type = "string"
required = false
non_empty = true
description = "REQUIRED WHEN user_facing == true."

[types.ChangelogEntry.fields.type]
type = "enum"
required = false
values = ["feature", "fix", "breaking"]
description = "REQUIRED WHEN user_facing == true."

[types.ChangelogEntry.fields.release_type]
type = "enum"
required = false
values = ["ota", "build"]

[types.ChangelogEntry.fields.id]
type = "string"
required = true
non_empty = true
description = "Stable identifier. REQUIRED in changeset-file mode (validate_schema: \"id is required in changeset-file mode\")."

[types.ChangelogEntry.fields.packages]
type = "array"
required = false
[types.ChangelogEntry.fields.packages.item]
type = "string"

[[types.ChangelogEntry.constraints]]
form = "conditional-required"
field = "description"
when = { field = "user_facing", predicate = "equals", value = true }

[[types.ChangelogEntry.constraints]]
form = "conditional-required"
field = "type"
when = { field = "user_facing", predicate = "equals", value = true }
