# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 1
bump = "patch"
include = ["pypi", "go", "npm"]
exclude = []
description = "Fixes the Python CLI's first-run download URL, which pointed at a retired release tag and 404'd."
context = "The Python launcher still built its GitHub Release URL from the per-package\n`go-strictspec@v<version>` tag that the releasable-group migration retired.\nReleases have been tagged `strictspec@v<version>` since that migration and\ncarry the goreleaser archives and `checksums.txt` there, so every fresh\ninstall of a 0.2.x wheel failed on its first `strictspec` invocation with\n`HTTP Error 404` and the CLI was unusable until the cache was seeded by hand.\nThis is a fix-forward patch for that shipped defect."
