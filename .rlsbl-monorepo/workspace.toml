
# strictspec is one tool: the Go CLI plus the per-language launcher/runtime
# packages, whose exact version pairing (DESIGN decision 31) requires a single
# version. All three packages are members of one releasable.
[[releasables]]
name = "go-strictspec"


[[projects]]
path = "python"
name = "py-strictspec"
releasable = "go-strictspec"
watch = ["python/**"]
import_name = "strictspec"


[[projects]]
path = "go"
name = "go-strictspec"
releasable = "go-strictspec"


[[projects]]
path = "ts"
name = "ts-strictspec"
releasable = "go-strictspec"

[[projects]]
path = "conformance/"
name = "conformance"
dev_only = true
releasable = false
watch = ["python/**", "go/**", "ts/**", "spec/**"]
