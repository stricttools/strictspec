[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strictspec"
version = "0.2.5"
description = "schema toolchain that turns one TOML schema into Go, Python and TypeScript validators reporting identical verdicts, error codes, paths and messages for JSON, TOML and JSONL files (Python runtime and CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S. M. Hosseini", email = "m.hosseini@veliu.com" }]
keywords = ["strictspec", "schema", "codegen", "validation", "toml", "rlsbl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tomlkit"]

[project.scripts]
strictspec = "strictspec._launcher:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/strictspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://smmh.dev/strictspec/"
Documentation = "https://smmh.dev/strictspec/"
Repository = "https://github.com/smm-h/strictspec"
Issues = "https://github.com/smm-h/strictspec/issues"
Changelog = "https://github.com/smm-h/strictspec/blob/main/CHANGELOG.md"
