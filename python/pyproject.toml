[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strictspec"
version = "0.3.0"
description = "Define a schema once in TOML, and generate the full toolchain in your language: validation, versioning, migrations, etc. -- First-class support for Go, Python, and TypeScript"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S. M. Hosseini", email = "m.hosseini@veliu.com" }]
keywords = ["strictspec", "schema", "codegen", "validation", "toml", "rlsbl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tomlkit"]

[project.scripts]
strictspec = "strictspec._launcher:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/strictspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://smmh.dev/strictspec/"
Documentation = "https://smmh.dev/strictspec/"
Repository = "https://github.com/stricttools/strictspec"
Issues = "https://github.com/stricttools/strictspec/issues"
Changelog = "https://github.com/stricttools/strictspec/blob/main/CHANGELOG.md"
