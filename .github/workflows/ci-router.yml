# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: Run every member's CI jobs whatever the path filters say, so a release candidate's members run their own CI on a commit whose push touched none of their paths
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}-${{ inputs.run_all }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      go-strictspec: ${{ steps.changes.outputs['go-strictspec'] }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            go-strictspec:
              - 'go/**'
              - '.github/workflows/ci-router.yml'
              - '.strictmetadata/changelog/strictspec/CHANGELOG.md'
          predicate-quantifier: some-with-excludes
  go-strictspec-ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-go reads go.mod's `toolchain` line first, then its `go` directive.
      # Declare the development Go in `toolchain` (go mod edit -toolchain=goX.Y.Z)
      # so CI tests with it; `go` stays the minimum consumers need.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: go test ./... -race -short -timeout=10m
    name: go-strictspec-ci / test
    needs:
      - detect
    if: (needs.detect.outputs['go-strictspec'] == 'true' || inputs.run_all)
    defaults:
      run:
        working-directory: go
