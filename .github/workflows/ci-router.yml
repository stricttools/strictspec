# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      strictspec: ${{ steps.changes.outputs.strictspec }}
      go-strictspec: ${{ steps.changes.outputs.go-strictspec }}
      ts-strictspec: ${{ steps.changes.outputs.ts-strictspec }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          strictspec:
            - 'python/**'
            - 'python/**'
          go-strictspec: 'go/**'
          ts-strictspec: 'ts/**'
  strictspec-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python: >= 3.11
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uv python install ${{ matrix.python-version }}
    - run: uv sync --locked
    - run: uv run python -c "import strictspec"
    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.24.3
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
    - run: uv run pytest --rootdir .
    defaults:
      run:
        working-directory: python
    name: strictspec-ci / test
    needs:
    - detect
    if: needs.detect.outputs.strictspec == 'true'
  go-strictspec-ci-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      # go.mod: go 1.26.3
    - uses: actions/setup-go@v6
      with:
        go-version-file: go/go.mod
    - run: go vet ./...
    - run: go test ./... -race -short -timeout=10m
    defaults:
      run:
        working-directory: go
    name: go-strictspec-ci / test
    needs:
    - detect
    if: needs.detect.outputs.go-strictspec == 'true'
  ts-strictspec-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node: >= 22
        node-version: [20, 22, 24]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    - run: npm test --if-present
    - run: npm audit --audit-level=moderate || true
    defaults:
      run:
        working-directory: ts
    name: ts-strictspec-ci / test
    needs:
    - detect
    if: needs.detect.outputs.ts-strictspec == 'true'
