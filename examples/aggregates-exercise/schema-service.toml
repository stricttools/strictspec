name = "service"
meta_version = 1
format_version = 1
description = "One service in a fleet: image, memory reservation, replica count."
document_syntax = "toml"
targets = ["go", "python"]

[fields.name]
type = "string"
required = true
non_empty = true

[fields.image]
type = "string"
required = true
non_empty = true

[fields.memory_mb]
type = "integer"
required = true
min = 64
max = 8192
description = "Per-replica memory reservation in MiB. Summed by the fleet budget."

[fields.replicas]
type = "integer"
required = true
min = 1
max = 20
