name = "imagine-bookmarks"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "Bookmarks"
targets = ["ts"]
safe_integers = true
description = "bookmarks.json — per-node view bookmarks; module-typed opaque leaves (imagine §6.4, §6.5)."

[types.Bookmarks]
type = "record"

# node (turn tag) -> opaque module-typed view. The engine stores/transports these opaque values
# but never interprets them (§7 view is module-typed). Each leaf declares its stance (decision 29).
[types.Bookmarks.fields.bookmarks]
type = "map"
required = true
key_pattern = "^turn/[0-9]{6,}$"
order = "incidental"
[types.Bookmarks.fields.bookmarks.value]
type = "opaque"
consumer_check = "module.validateView"
