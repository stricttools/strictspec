# Shared type-definition file for the imagine runtime-state schemas (imagine §2, §6.1).
# Types only. Imported by events / sequence / inflight / bookmarks.
name = "imagine-common-types"
meta_version = 1
format_version = 1
role = "type-definitions"
description = "Shared grammars for the imagine document family: ULIDs, dirnames, principal ids, node refs."

# Crockford base32 ULID (26 chars). Scalar-refinement: a string site + regex.
[types.Ulid]
type = "string"
regex = "^[0-9A-HJKMNP-TV-Z]{26}$"
description = "A ULID identifier."

# Document dirname: <module>--<name>, each segment [a-z][a-z0-9]*(-[a-z0-9]+)*, or the project
# sentinel '-' (§6.1; §8.1 project-scoped events use '-').
[types.DocRef]
type = "string"
regex = "^(-|[a-z][a-z0-9]*(-[a-z0-9]+)*--[a-z][a-z0-9]*(-[a-z0-9]+)*(/[^\\s]+)?)$"
description = "A document dirname (module--name), optional /inner-path, or the '-' project sentinel."

# Principal id: a slug (§2 registry; MVP: 'local', 'engine', slugified agent name).
[types.PrincipalId]
type = "string"
regex = "^[a-z0-9][a-z0-9-]*$"
description = "A principal id from the committed registry."

# A world-tree node = a turn tag (§6.4). Bookmarks are keyed per node.
[types.NodeRef]
type = "string"
regex = "^turn/[0-9]{6,}$"
description = "A turn-tag node reference."
