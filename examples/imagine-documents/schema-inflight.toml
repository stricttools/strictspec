name = "imagine-inflight"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "Inflight"
targets = ["ts"]
safe_integers = true
description = "inflight.json — the always-on in-flight op record, any actor (imagine §6.9)."

imports = [ { file = "types-imagine-common.toml", types = ["DocRef", "PrincipalId"] } ]

[types.Inflight]
type = "record"

# At most one op is in flight (one pen, §6.7). Written before the file write, cleared after the
# commit; absent/null when nothing is in flight. Nullable wraps the discriminated union.
[types.Inflight.fields.op]
type = "nullable"
required = true
description = "The in-flight op, or null when idle."
[types.Inflight.fields.op.inner]
type = "discriminated-union"
discriminator = "type"

# file ops (path-scoped within one document, §6.3). Arm names contain a dot, so they are quoted.
[types.Inflight.fields.op.inner.arms."file.create".fields.type]
type = "literal"
value = "file.create"
required = true
[types.Inflight.fields.op.inner.arms."file.create".fields.actor]
type = "PrincipalId"
required = true
[types.Inflight.fields.op.inner.arms."file.create".fields.document]
type = "DocRef"
required = true
[types.Inflight.fields.op.inner.arms."file.create".fields.path]
type = "string"
required = true
non_empty = true

[types.Inflight.fields.op.inner.arms."file.update".fields.type]
type = "literal"
value = "file.update"
required = true
[types.Inflight.fields.op.inner.arms."file.update".fields.actor]
type = "PrincipalId"
required = true
[types.Inflight.fields.op.inner.arms."file.update".fields.document]
type = "DocRef"
required = true
[types.Inflight.fields.op.inner.arms."file.update".fields.path]
type = "string"
required = true
non_empty = true

[types.Inflight.fields.op.inner.arms."file.delete".fields.type]
type = "literal"
value = "file.delete"
required = true
[types.Inflight.fields.op.inner.arms."file.delete".fields.actor]
type = "PrincipalId"
required = true
[types.Inflight.fields.op.inner.arms."file.delete".fields.document]
type = "DocRef"
required = true
[types.Inflight.fields.op.inner.arms."file.delete".fields.path]
type = "string"
required = true
non_empty = true

[types.Inflight.fields.op.inner.arms."file.move".fields.type]
type = "literal"
value = "file.move"
required = true
[types.Inflight.fields.op.inner.arms."file.move".fields.actor]
type = "PrincipalId"
required = true
[types.Inflight.fields.op.inner.arms."file.move".fields.document]
type = "DocRef"
required = true
[types.Inflight.fields.op.inner.arms."file.move".fields.from]
type = "string"
required = true
non_empty = true
[types.Inflight.fields.op.inner.arms."file.move".fields.to]
type = "string"
required = true
non_empty = true
