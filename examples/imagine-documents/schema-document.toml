name = "imagine-document"
meta_version = 1
format_version = 1
description = "document.json — the only engine-read file inside a document dir: description + module schema version (imagine §6.1)."
document_syntax = "json"
targets = ["ts"]
safe_integers = true

[fields.description]
type = "string"
required = true
description = "Document description (for agents; surfaced uniformly)."

[fields.moduleVersion]
type = "integer"
required = true
min = 0
description = "Module schema version. On open, a mismatch is a hard error pointing at `imagine migrate`. Immutable via ops (§6.1). See gap note on format_version overlap."
