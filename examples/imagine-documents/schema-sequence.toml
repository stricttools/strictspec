name = "imagine-sequence"
meta_version = 1
format_version = 1
description = "sequence.json — the open-sequence journal; a per-kind discriminated union (imagine §6.9)."
document_syntax = "json"
targets = ["ts"]
safe_integers = true

imports = [ { file = "types-imagine-common.toml", types = ["Ulid", "DocRef", "NodeRef"] } ]

# The journal holds AT MOST one open sequence. When none is open the file is {format_version,
# open: null} (JSON nullable is fine here — this schema is JSON, not TOML).
[fields.open]
type = "union"
required = true
nullable = true              # T | null (JSON only; appendix-semantics 3.7)
discriminator = "kind"
description = "The single open engine-driven multi-commit sequence, or null."

# --- arm: open agent turn (§6.9) ---
[fields.open.arms.agent-turn.fields.kind]
type = "literal"
value = "agent-turn"
required = true
[fields.open.arms.agent-turn.fields.ulid]
type = "Ulid"
required = true
[fields.open.arms.agent-turn.fields.opened_at]
type = "integer"
required = true
min = 0
[fields.open.arms.agent-turn.fields.event_cursor]
type = "integer"
required = true
min = 0
[fields.open.arms.agent-turn.fields.touched_files]
type = "array"
required = true
item_type = "string"
[fields.open.arms.agent-turn.fields.abort_progress]
type = "integer"
required = false
min = 0
description = "Commits reverted so far during a mid-abort crash-resume; absent when not aborting."

# --- arm: restore (§6.9) ---
[fields.open.arms.restore.fields.kind]
type = "literal"
value = "restore"
required = true
[fields.open.arms.restore.fields.ulid]
type = "Ulid"
required = true
[fields.open.arms.restore.fields.document]
type = "DocRef"
required = true
[fields.open.arms.restore.fields.target_node]
type = "NodeRef"
required = true

# --- arm: reconciliation (§6.9, §6.10) ---
[fields.open.arms.reconciliation.fields.kind]
type = "literal"
value = "reconciliation"
required = true
[fields.open.arms.reconciliation.fields.ulid]
type = "Ulid"
required = true
[fields.open.arms.reconciliation.fields.mode]
type = "enum"
required = true
values = ["adopt-all", "revert-all"]

# --- arm: document.rename fan-out (§6.3, §6.9) ---
[fields.open.arms.rename.fields.kind]
type = "literal"
value = "rename"
required = true
[fields.open.arms.rename.fields.ulid]
type = "Ulid"
required = true
[fields.open.arms.rename.fields.from]
type = "DocRef"
required = true
[fields.open.arms.rename.fields.to]
type = "DocRef"
required = true
[fields.open.arms.rename.fields.rewritten_paths]
type = "array"
required = true
item_type = "string"
