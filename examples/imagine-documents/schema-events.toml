name = "imagine-events"
meta_version = 1
format_version = 1
document_syntax = "jsonl"
role = "schema"
root = "Event"
targets = ["ts"]
safe_integers = true   # cursor and ts (epoch ms ~1.7e12) stay < 2^53
description = "events.jsonl — one event envelope per line; module-typed opaque payloads (imagine §8.1)."

imports = [ { file = "types-imagine-common.toml", types = ["Ulid", "DocRef", "PrincipalId"] } ]

# Each JSONL line is one event; the root is this record and carries a per-line format_version.
[types.Event]
type = "record"

[types.Event.fields.id]
type = "Ulid"
required = true

[types.Event.fields.cursor]
type = "integer"
required = true
min = 0
description = "Per-project monotonic cursor (§8.1)."

[types.Event.fields.ts]
type = "integer"
required = true
min = 0
description = "Epoch milliseconds."

[types.Event.fields.user]
type = "PrincipalId"
required = true
description = "Emitting principal (one attribution vocabulary for commits and events)."

[types.Event.fields.document]
type = "DocRef"
required = true
description = "Owning document dirname, or '-' for project-scoped events."

[types.Event.fields.type]
type = "string"
required = true
non_empty = true
description = "Event type. Core types (turn.handoff, travel, ...) and module types (select, draw.2d, ...) share this field; the engine does not discriminate module types — see gap note."

# Module-typed payload — OPAQUE to the engine (§5 blackbox boundary). Validated on ingest by the
# owning module (§8.1), never by strictspec. The consumer_check stance records the boundary; the
# inventory prints it (decision 29).
[types.Event.fields.data]
type = "opaque"
required = true
consumer_check = "module.validateEventData"

[types.Event.fields.context]
type = "record"
required = false
[types.Event.fields.context.fields.selection]
type = "array"
required = false
[types.Event.fields.context.fields.selection.item]
type = "string"                # engine-level string ids (§8.1)
[types.Event.fields.context.fields.view]
type = "opaque"                # module-typed, opaque
required = false
consumer_check = "module.validateView"
