name = "claude-usage"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "Usage"
targets = ["python", "go", "ts"]
safe_integers = true   # token counts; TS target present, so this is mandatory
description = "statusline stdin JSON + usage-API windows (BetterClaude §3 usage contract)."

imports = [ { file = "types-claude-common.toml", types = ["SessionId", "ModelName", "Tier", "Instant"] } ]

[types.Usage]
type = "record"

# --- statusline stdin JSON (what Claude passes to the statusline program) ---
[types.Usage.fields.session_id]
type = "SessionId"
required = true

[types.Usage.fields.model]
type = "record"
required = true
[types.Usage.fields.model.fields.id]
type = "ModelName"
required = true
[types.Usage.fields.model.fields.display_name]
type = "string"
required = true
non_empty = true

[types.Usage.fields.workspace]
type = "record"
required = true
[types.Usage.fields.workspace.fields.current_dir]
type = "string"
required = true
non_empty = true
[types.Usage.fields.workspace.fields.project_dir]
type = "string"
required = true
non_empty = true

[types.Usage.fields.tier]
type = "Tier"
required = false

[types.Usage.fields.cost]
type = "record"
required = false
[types.Usage.fields.cost.fields.total_cost_usd]
type = "number"                # NUMBER scalar: accepts int or float lexeme, binds float64
required = true
min = 0

# --- usage-API windows ---
[types.Usage.fields.windows]
type = "array"
required = false
[types.Usage.fields.windows.item]
type = "record"
[types.Usage.fields.windows.item.fields.start]
type = "Instant"
required = true
[types.Usage.fields.windows.item.fields.end]
type = "Instant"
required = true
[types.Usage.fields.windows.item.fields.input_tokens]
type = "integer"
required = true
min = 0
[types.Usage.fields.windows.item.fields.output_tokens]
type = "integer"
required = true
min = 0
# each window's start must precede its end (ordered-pair; same-kind offset instants)
[[types.Usage.fields.windows.item.constraints]]
form = "ordered-pair"
less = "start"
than = "end"
