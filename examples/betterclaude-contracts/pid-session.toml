name = "claude-pid-session"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "PidSession"
targets = ["python", "go"]
safe_integers = true
description = "PID session file: maps a running process to a session, project, and on-disk layout (BetterClaude §3 transcript contract, PID session files)."

imports = [ { file = "types-claude-common.toml", types = ["SessionId", "Instant", "ProjectPathCodec"] } ]

[types.PidSession]
type = "record"

[types.PidSession.fields.pid]
type = "integer"
required = true
min = 1

[types.PidSession.fields.session_id]
type = "SessionId"
required = true

[types.PidSession.fields.project]
type = "ProjectPathCodec"
required = true

# The three session LAYOUTS (§3): code / desktop / cowork — where transcripts live on disk.
[types.PidSession.fields.layout]
type = "enum"
required = true
values = ["code", "desktop", "cowork"]

[types.PidSession.fields.started_at]
type = "Instant"
required = true
