name = "claude-profiles"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "Profiles"
targets = ["python", "go"]
description = "profiles registry: config-dir precedence, the profile map, and the active profile (BetterClaude §3 profiles contract)."

imports = [ { file = "types-claude-common.toml", types = ["ProfileName", "ModelName", "Tier"] } ]

[types.Profiles]
type = "record"

# Ordered config-dir precedence (e.g. CLAUDEWHEEL_CONFIG_DIR -> ~/.claudewheel; §17).
[types.Profiles.fields.config_dir_precedence]
type = "array"
required = true
min_len = 1
description = "Order is semantic: earlier entries win. The array binds order-preserving."
[types.Profiles.fields.config_dir_precedence.item]
type = "string"

[types.Profiles.fields.active]
type = "ProfileName"
required = true
description = "Must name a key in `profiles` (see reference constraint)."

# The claudewheel profile registry: name -> profile record.
[types.Profiles.fields.profiles]
type = "map"
required = true
key_pattern = "^[a-z0-9][a-z0-9_-]*$"
order = "incidental"
[types.Profiles.fields.profiles.value]
type = "record"
[types.Profiles.fields.profiles.value.fields.name]
type = "ProfileName"
required = true
[types.Profiles.fields.profiles.value.fields.path]
type = "string"
required = true
non_empty = true
[types.Profiles.fields.profiles.value.fields.model]
type = "ModelName"
required = false
[types.Profiles.fields.profiles.value.fields.tier]
type = "Tier"
required = false

# The active profile must resolve to a declared profile key (intra-document reference into a map).
[[types.Profiles.constraints]]
form = "intra-document-references"
reference = "active"
resolves_into = "profiles"
resolves_by = "map-key"
