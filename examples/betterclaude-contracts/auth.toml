name = "claude-auth"
meta_version = 1
format_version = 1
description = "credentials-file shape: OAuth client, tokens, tier, and the tier->display table (BetterClaude DESIGN.md §3 auth contract)."
document_syntax = "json"
targets = ["python", "go"]

# Imports from TWO type files — the multi-file import case.
imports = [
  { file = "types-http.toml", types = ["OAuthClient"] },
  { file = "types-claude-common.toml", types = ["Tier", "Instant"] },
]

[fields.oauth]
type = "OAuthClient"
required = true
description = "Imported record: client id + endpoints + headers."

[fields.tokens]
type = "record"
required = true
[fields.tokens.fields.access_token]
type = "string"
required = true
non_empty = true
[fields.tokens.fields.refresh_token]
type = "string"
required = false
non_empty = true
[fields.tokens.fields.expires_at]
type = "Instant"
required = true
[fields.tokens.fields.scopes]
type = "array"
required = true
item_type = "string"

[fields.tier]
type = "Tier"
required = true

# tier -> display table (authored fresh into the auth schema; §3 / decision 17). A typed map
# keyed by tier NAME (see gap note: keys are regex-constrained, not enum-constrained).
[fields.tier_display]
type = "map"
required = true
key_pattern = "^(free|pro|max_5x|max_20x|team|enterprise)$"
order = "incidental"
[fields.tier_display.value]
type = "record"
[fields.tier_display.value.fields.display_name]
type = "string"
required = true
non_empty = true
[fields.tier_display.value.fields.abbreviation]
type = "string"
required = true
non_empty = true
max_length = 4
