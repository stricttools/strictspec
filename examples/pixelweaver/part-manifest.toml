# strictspec schema — PixelWeaver PartManifest (paper draft)
# Pinned surface (.stricttools/docs/appendix-surface-syntax.md). Translated from
# schemas/part-manifest.schema.json (PixelWeaver, JSON docs).

name = "PartManifest"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "PartManifest"
description = "PixelWeaver part-manifest export format (v1). Composable sprite parts: stacking order, palette classes into a shared master palette, per-part variant strips, anchors, and pairing."

[types.PartManifest]
type = "record"

[types.PartManifest.fields.format]
type = "literal"
required = true
value = "pixelweaver-part-manifest"
description = "Self-identifying document type."

[types.PartManifest.fields.version]
type = "string"
required = true
regex = '^\d+\.\d+\.\d+$'
description = "Format version. v1 emits \"1.0.0\"."

[types.PartManifest.fields.frame]
type = "FrameSpec"
required = true
description = "Shared cell geometry and anchor for ALL parts."

[types.PartManifest.fields.alphaPolicy]
type = "literal"
required = true
value = "binary"
description = "Only legal v1 value."

[types.PartManifest.fields.palette]
type = "array"
required = true
description = "Master palette copied from the constraint manifest. Empty array when the project has no manifest."
[types.PartManifest.fields.palette.item]
type = "string"
regex = '^#[0-9a-fA-F]{6}$'

[types.PartManifest.fields.classes]
type = "array"
required = true
description = "Palette classes copied from the constraint manifest."
[types.PartManifest.fields.classes.item]
type = "PaletteClass"

[types.PartManifest.fields.parts]
type = "array"
required = true
description = "Composable sprite parts, sorted by zOrder ascending."
[types.PartManifest.fields.parts.item]
type = "Part"

[types.PartManifest.fields.pairings]
type = "array"
required = true
description = "Part-level index-locks. May be empty."
[types.PartManifest.fields.pairings.item]
type = "Pairing"

# --- x- keyword mappings + prose-only rules (see gap-note.md) ---

# x-pairwise-distinct on palette
[[types.PartManifest.constraints]]
form = "pairwise-distinct"
collection = "palette"
normalization = "case-fold"

# x-unique-field: "id" on classes
[[types.PartManifest.constraints]]
form = "unique-by"
collection = "classes"
field = "id"
normalization = "none"

# x-range-nonoverlap on classes (half-open; well-formed-first; no in-bounds leg)
[[types.PartManifest.constraints]]
form = "ranges-disjoint"
collection = "classes"
start = "start"
length = "len"

# x-unique-field: "name" on parts
[[types.PartManifest.constraints]]
form = "unique-by"
collection = "parts"
field = "name"
normalization = "none"

# NOTE: "zOrder unique across parts" (Part.zOrder description) has NO x- keyword
# in the source and is NOT enforced by the generator. Expressible as unique-by,
# added here as a real strictspec check (a strengthening the source only stated
# in prose). See gap-note.md.
[[types.PartManifest.constraints]]
form = "unique-by"
collection = "parts"
field = "zOrder"
normalization = "none"

# --- named types ---

[types.FrameSpec]
type = "record"
description = "Shared cell geometry and anchor applied to every part."
[types.FrameSpec.fields.width]
type = "integer"
required = true
min = 1
[types.FrameSpec.fields.height]
type = "integer"
required = true
min = 1
[types.FrameSpec.fields.anchorX]
type = "integer"
required = true
[types.FrameSpec.fields.anchorY]
type = "integer"
required = true

[types.PaletteClass]
type = "record"
description = "A palette class copied from the constraint manifest."
[types.PaletteClass.fields.id]
type = "string"
required = true
min_length = 1
[types.PaletteClass.fields.name]
type = "string"
required = true
min_length = 1
[types.PaletteClass.fields.start]
type = "integer"
required = true
min = 0
[types.PaletteClass.fields.len]
type = "integer"
required = true
min = 1
[types.PaletteClass.fields.reserved]
type = "boolean"
required = false

[types.Variant]
type = "record"
description = "One variant row of a part's sprite strip."
[types.Variant.fields.index]
type = "integer"
required = true
min = 0
[types.Variant.fields.canvas]
type = "string"
required = true
min_length = 1
[types.Variant.fields.frameCount]
type = "integer"
required = true
min = 1
[types.Variant.fields.frameDurationsMs]
type = "array"
required = true
description = "Per-frame durations in ms (length frameCount, no nulls)."
[types.Variant.fields.frameDurationsMs.item]
type = "integer"
min = 1

[types.StripSet]
type = "record"
description = "Strip file names for a part."
[types.StripSet.fields.indexed]
type = "nullable"
required = true
description = "Role-indexed strip file; null exactly when paletteClassId is null."
[types.StripSet.fields.indexed.inner]
type = "string"
[types.StripSet.fields.rgba]
type = "string"
required = true
min_length = 1
description = "Resolved-RGBA strip file; always present."

[types.PartGrid]
type = "record"
description = "Cell layout of a part's strip images."
[types.PartGrid.fields.frameWidth]
type = "integer"
required = true
min = 1
[types.PartGrid.fields.frameHeight]
type = "integer"
required = true
min = 1
[types.PartGrid.fields.columns]
type = "integer"
required = true
min = 1
[types.PartGrid.fields.rows]
type = "integer"
required = true
min = 1
[types.PartGrid.fields.padding]
type = "integer"
required = true
min = 0

[types.Part]
type = "record"
description = "A composable sprite part."
[types.Part.fields.name]
type = "string"
required = true
regex = '^[a-zA-Z0-9][a-zA-Z0-9._\-]{0,63}$'
[types.Part.fields.partSet]
type = "string"
required = true
min_length = 1
[types.Part.fields.zOrder]
type = "integer"
required = true
description = "Stacking order, lower composites first; unique across parts."
[types.Part.fields.paletteClassId]
type = "nullable"
required = true
description = "Class whose ramp all role pixels use; null = pure-rgba part."
[types.Part.fields.paletteClassId.inner]
type = "string"
[types.Part.fields.variants]
type = "array"
required = true
min_len = 1
[types.Part.fields.variants.item]
type = "Variant"
[types.Part.fields.strips]
type = "StripSet"
required = true
[types.Part.fields.grid]
type = "PartGrid"
required = true

[types.Pairing]
type = "record"
description = "A part-level index-lock binding two parts."
[types.Pairing.fields.partA]
type = "string"
required = true
min_length = 1
description = "First part name; partA < partB lexicographically (prose-only in source)."
[types.Pairing.fields.partB]
type = "string"
required = true
min_length = 1

# Pairing.partA < partB is stated in prose in the source. It IS expressible as an
# ordered-pair constraint (string natural order). Added as a real check; see gap-note.
[[types.Pairing.constraints]]
form = "ordered-pair"
less = "partA"
than = "partB"
